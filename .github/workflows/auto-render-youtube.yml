name: GAINN Shorts – render & upload to YouTube

on:
  schedule:
    - cron: "15 */4 * * *"   # every 4 hours (daily cap enforced by the backend)
  workflow_dispatch: {}

jobs:
  render-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FN: https://lwdzzvrzsrssaocaprnl.supabase.co/functions/v1
      RS: ${{ secrets.RENDERER_SECRET }}
      AK: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx3ZHp6dnJ6c3Jzc2FvY2Fwcm5sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5NzEwNzcsImV4cCI6MjA4ODU0NzA3N30.zbBNAlbQjv3CIbNIsX3S3MkkXTzjmx5febTlGa2mmBk
    steps:
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg jq fonts-noto-core fonts-noto-extra

      - name: Get next story
        id: next
        run: |
          curl -sS -X POST "$FN/youtube-publisher" -H "apikey: $AK" -H "x-renderer-secret: $RS" \
            -H "Content-Type: application/json" -d '{"action":"next"}' > next.json
          jq 'del(.audioBase64)' next.json
          ID=$(jq -r '.item.id // empty' next.json)
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Render vertical Short
        if: steps.next.outputs.id != ''
        run: |
          set -e
          jq -r '.item.title' next.json | fold -s -w 24 > title.txt
          jq -r '.item.source_name // "GAINN"' next.json > source.txt
          if [ "$(jq -r '.audioBase64 // empty' next.json)" != "" ]; then
            jq -r '.audioBase64' next.json | base64 -d > voice.wav
          else
            ffmpeg -y -f lavfi -i anullsrc=r=22050:cl=mono -t 20 voice.wav
          fi
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 voice.wav)
          DUR=$(python3 -c "print(min(58, float('$DUR')+1))")
          FONT=/usr/share/fonts/truetype/noto/NotoSansDevanagari-Bold.ttf
          [ -f "$FONT" ] || FONT=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
          ffmpeg -y -f lavfi -i "color=c=0x060910:s=1080x1920:d=$DUR" -i voice.wav -filter_complex \
            "[0]drawbox=y=0:w=iw:h=12:color=0x00D4FF:t=fill,\
             drawtext=fontfile=$FONT:text='GAINN':fontsize=72:fontcolor=0x00D4FF:x=(w-tw)/2:y=180,\
             drawtext=fontfile=$FONT:textfile=title.txt:fontsize=64:fontcolor=white:line_spacing=18:x=(w-tw)/2:y=(h-th)/2,\
             drawtext=fontfile=$FONT:textfile=source.txt:fontsize=40:fontcolor=0xAAB4C3:x=(w-tw)/2:y=h-360,\
             drawtext=fontfile=$FONT:text='ever-news-flow.lovable.app':fontsize=36:fontcolor=0x00D4FF:x=(w-tw)/2:y=h-260[v]" \
            -map "[v]" -map 1:a -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest -t "$DUR" short.mp4

      - name: Upload to YouTube
        if: steps.next.outputs.id != ''
        run: |
          set -e
          jq -n --arg id "${{ steps.next.outputs.id }}" --rawfile v <(base64 -w0 short.mp4) \
            '{queueItemId:$id, videoBase64:$v, mimeType:"video/mp4"}' > upload.json
          curl -sS -X POST "$FN/youtube-upload" -H "apikey: $AK" -H "x-renderer-secret: $RS" \
            -H "Content-Type: application/json" --data-binary @upload.json | tee result.json
          jq -e '.success == true' result.json

      - name: Report render failure
        if: failure() && steps.next.outputs.id != ''
        run: |
          curl -sS -X POST "$FN/youtube-publisher" -H "apikey: $AK" -H "x-renderer-secret: $RS" \
            -H "Content-Type: application/json" -d "{\"action\":\"fail\",\"id\":\"${{ steps.next.outputs.id }}\",\"error\":\"Render step failed in GitHub Actions\"}"
