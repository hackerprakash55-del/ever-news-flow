name: GAINN Shorts – render & upload to YouTube

on:
  schedule:
    - cron: "15 */4 * * *"   # every 4 hours (daily cap enforced by the backend)
  workflow_dispatch: {}

jobs:
  render-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FN: https://lwdzzvrzsrssaocaprnl.supabase.co/functions/v1
      RS: ${{ secrets.RENDERER_SECRET }}
      AK: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx3ZHp6dnJ6c3Jzc2FvY2Fwcm5sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5NzEwNzcsImV4cCI6MjA4ODU0NzA3N30.zbBNAlbQjv3CIbNIsX3S3MkkXTzjmx5febTlGa2mmBk
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq fonts-noto python3-pil

      - name: Get next story
        id: next
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST "$FN/youtube-publisher" -H "apikey: $AK" -H "x-renderer-secret: $RS" \
            -H "Content-Type: application/json" -d '{"action":"next"}' > next.json
          jq 'del(.audioBase64)' next.json
          ID=$(jq -r '.item.id // empty' next.json)
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Download story photo
        if: steps.next.outputs.id != ''
        run: |
          IMG=$(jq -r '.item.image_url // empty' next.json)
          if [ -n "$IMG" ]; then
            curl -sSL --max-time 30 "$IMG" -o story.jpg || rm -f story.jpg
            if [ -f story.jpg ] && ! ffprobe -v error -show_entries stream=codec_type -of csv=p=0 story.jpg | grep -q video; then
              rm -f story.jpg
            fi
          fi

      - name: Render title as a shaped image (correct Hindi letters, no overlap)
        if: steps.next.outputs.id != ''
        run: |
          LANG=$(jq -r '.item.language // "en-IN"' next.json)
          jq -r '.item.title' next.json > title_raw.txt
          jq -r '.item.source_name // "GAINN"' next.json > source.txt
          python3 - "$LANG" <<'PYEOF'
          from PIL import Image, ImageDraw, ImageFont
          import textwrap, glob, sys
          lang = sys.argv[1]
          text = open("title_raw.txt", encoding="utf-8").read().strip()
          width = 18 if lang == "hi-IN" else 24
          lines = []
          for para in text.split("\n"):
              lines.extend(textwrap.wrap(para, width=width) or [""])
          lines = lines[:5]
          if lang == "hi-IN":
              candidates = glob.glob("/usr/share/fonts/**/NotoSansDevanagari*Bold*.ttf", recursive=True) or \
                           glob.glob("/usr/share/fonts/**/NotoSansDevanagari*.ttf", recursive=True)
              path = candidates[0]
          else:
              path = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          size = 54 if len(lines) <= 4 else 46
          font = ImageFont.truetype(path, size)
          img = Image.new("RGBA", (1000, int(size * 1.5) * len(lines) + 20), (0, 0, 0, 0))
          d = ImageDraw.Draw(img)
          d.multiline_text((0, 0), "\n".join(lines), font=font, fill=(255, 255, 255, 255),
                           spacing=14, stroke_width=2, stroke_fill=(0, 0, 0, 160))
          img.crop(img.getbbox()).save("title_img.png")
          PYEOF

      - name: Render vertical Short
        if: steps.next.outputs.id != ''
        run: |
          set -euo pipefail
          jq -er '.audioBase64 | select(type == "string" and length > 0)' next.json | base64 -d > voice.wav
          python3 .github/scripts/check-shorts-audio.py voice.wav
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 voice.wav)
          DUR=$(python3 -c "print(min(58, float('$DUR')+1))")
          FRAMES=$(python3 -c "print(int(float('$DUR')*30))")
          LATIN=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf

          BRAND="drawbox=y=0:w=iw:h=10:color=0x00D4FF:t=fill,\
drawtext=fontfile=$LATIN:text='GAINN':fontsize=64:fontcolor=0x00D4FF:x=60:y=110,\
drawtext=fontfile=$LATIN:textfile=source.txt:fontsize=38:fontcolor=0xAAB4C3:x=60:y=h-200,\
drawtext=fontfile=$LATIN:text='ever-news-flow.lovable.app':fontsize=34:fontcolor=0x00D4FF:x=60:y=h-130"

          if [ -f story.jpg ]; then
            # Real photo background: cover-crop + slow zoom (Ken Burns), dark lower band for text
            ffmpeg -y -loop 1 -i story.jpg -i title_img.png -i voice.wav -filter_complex \
              "[0]scale=1400:2489:force_original_aspect_ratio=increase,crop=1080:1920,zoompan=z='min(zoom+0.0009,1.18)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=$FRAMES:s=1080x1920:fps=30,eq=brightness=-0.12[bg];\
               [bg]drawbox=y=ih*0.42:w=iw:h=ih*0.58:color=black@0.55:t=fill[tmp];\
               [tmp][1]overlay=60:H-h-240-overlay_h[tmp2];[tmp2]$BRAND[v]" \
              -map "[v]" -map 2:a -c:v libx264 -preset medium -crf 23 -pix_fmt yuv420p -c:a aac -shortest -t "$DUR" short.mp4
          else
            # No photo: animated dark gradient instead of flat black
            ffmpeg -y -f lavfi -i "gradients=size=1080x1920:c0=0x060910:c1=0x0B1B2E:c2=0x060910:speed=0.02:duration=$DUR" -i title_img.png -i voice.wav -filter_complex \
              "[0]format=yuv420p[tmp];[tmp][1]overlay=60:H-h-240-overlay_h[tmp2];[tmp2]$BRAND[v]" \
              -map "[v]" -map 2:a -c:v libx264 -preset medium -crf 23 -pix_fmt yuv420p -c:a aac -shortest -t "$DUR" short.mp4
          fi
          python3 .github/scripts/check-shorts-audio.py short.mp4

      - name: Upload to YouTube
        if: steps.next.outputs.id != ''
        run: |
          set -e
          jq -n --arg id "${{ steps.next.outputs.id }}" --rawfile v <(base64 -w0 short.mp4) \
            '{queueItemId:$id, videoBase64:$v, mimeType:"video/mp4"}' > upload.json
          curl -sS -X POST "$FN/youtube-upload" -H "apikey: $AK" -H "x-renderer-secret: $RS" \
            -H "Content-Type: application/json" --data-binary @upload.json | tee result.json
          jq -e '.success == true' result.json

      - name: Report render failure
        if: failure() && steps.next.outputs.id != ''
        run: |
          curl -sS -X POST "$FN/youtube-publisher" -H "apikey: $AK" -H "x-renderer-secret: $RS" \
            -H "Content-Type: application/json" -d "{\"action\":\"fail\",\"id\":\"${{ steps.next.outputs.id }}\",\"error\":\"Render step failed in GitHub Actions\"}"
